# Runs the API on its own. The client has its own compose in its own
# repository: neither depends on where the other is checked out.
#
#   docker compose up --build     ->  http://localhost:3000
#
# The port is published because the client that consumes this API is a static
# bundle whose JavaScript runs in the browser, so it reaches the API on the host
# rather than over a compose network.

services:
  api:
    build: .
    image: toolbox-challenge-api
    container_name: toolbox-api
    ports:
      - "3000:3000"
    restart: unless-stopped
