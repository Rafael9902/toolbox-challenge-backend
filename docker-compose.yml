# Runs the whole challenge: the API and the web client.
#
# It lives in the API repository and builds the client from a sibling
# directory, so both repositories have to be cloned next to each other:
#
#   toolbox/
#   ├── toolbox-challenge-backend    <- docker compose up runs from here
#   └── toolbox-challenge-frontend
#
# The client is a static bundle: its JavaScript runs in the browser, not in the
# container, so it reaches the API at localhost:3000 on the host machine. That
# is why the API publishes its port instead of the two services talking over
# the compose network.

services:
  api:
    build: .
    image: toolbox-challenge-api
    container_name: toolbox-api
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build: ../toolbox-challenge-frontend
    image: toolbox-challenge-web
    container_name: toolbox-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
